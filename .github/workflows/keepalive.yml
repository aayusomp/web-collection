# Los proyectos gratuitos de Supabase se pausan si nadie los toca en una semana.
# Esto hace una consulta mínima cada lunes para que eso no pase.
name: Mantener Supabase despierto

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar la base de datos
        run: |
          URL=$(grep -oP "url:\s*'\K[^']+" js/config.js || true)
          KEY=$(grep -oP "anonKey:\s*'\K[^']+" js/config.js || true)

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase todavía no está configurado en js/config.js; no hay nada que hacer."
            exit 0
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" "$URL/rest/v1/caps?select=id&limit=1")
          echo "Respuesta de Supabase: $code"
          test "$code" = "200"
